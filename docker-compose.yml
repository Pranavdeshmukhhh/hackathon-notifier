version: "3.8"

services:
  # ── MongoDB Local Instance ─────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: hackathon_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hackathon_tracker
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Service (FastAPI + Telegram Bot Daemon) ─────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackathon_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - MONGO_URI=mongodb://mongo:27017/hackathon_tracker
      - FRONTEND_URL=http://localhost:5173
      - CACHE_TTL_SECONDS=60
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=3).raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
    driver: local
