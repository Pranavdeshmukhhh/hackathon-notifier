name: Bounded source scan
# No schedule existed in this checkout. Keep automatic production scans opt-in.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch only; no Mongo writes or notifications
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: source-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Backend/requirements.lock
      - name: Scan
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE_WORKERS: '4'
          SOURCE_TIMEOUT_SECONDS: '60'
          SOURCE_BUDGET_SECONDS: '240'
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python Backend/run_scan.py --dry-run
          else
            python Backend/run_scan.py
          fi
