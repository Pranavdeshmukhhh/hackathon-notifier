name: Release quality gates
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  PYTHON_DOTENV_DISABLED: '1'
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.lock
      - run: python -m pip install -r Backend/requirements.lock
      - run: python -m pip check
      - name: Disposable replica set
        run: python scripts/start_test_mongo.py
      - name: Complete tests and coverage gates
        env:
          PHASE4_TEST_MONGO: mongodb://127.0.0.1:27028/?directConnection=true&replicaSet=phase4
        run: |
          python -m pytest Backend/tests -q --cov --cov-report=term --cov-report=json:coverage.json --cov-report=xml:coverage.xml
          python scripts/check_coverage.py coverage.json
          python -m compileall -q Backend
      - name: Migration and offline benchmark smoke checks
        run: |
          python Backend/scripts/verify_release_migrations.py --output benchmarks/ci/migrations.json
          python Backend/scripts/benchmark_entity_resolution.py --sizes 200 --repeats 1 --output benchmarks/ci/matching.json
          python Backend/scripts/benchmark_source_failures.py --output benchmarks/ci/sources.json
      - name: Backend image and dynamic-port smoke check
        run: |
          docker build -t release-ci-api .
          python scripts/check_backend_container.py --image release-ci-api --mongo-container release-ci-mongo --output benchmarks/ci/container.json
      - name: Stop owned MongoDB
        if: always()
        run: python scripts/start_test_mongo.py --stop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-quality
          path: |
            coverage.json
            coverage.xml
            benchmarks/ci/
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run test:coverage
      - run: python ../scripts/generate_notices.py --check
      - run: npm run build
      - name: Isolated production browser checks
        working-directory: .
        env:
          BROWSER_ARTIFACT_DIR: /tmp/release-browser
          PHASE6_ARTIFACT_DIR: /tmp/release-browser
        run: |
          python -m pip install -r Backend/requirements.lock
          cd Frontend
          npx playwright install --with-deps chromium
          cd ..
          python scripts/preview_api.py > /tmp/release-api.log 2>&1 &
          api_pid=$!
          (cd Frontend && npm run preview -- --host 127.0.0.1 --port 5173) > /tmp/release-site.log 2>&1 &
          site_pid=$!
          trap 'kill "$api_pid" "$site_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for attempt in range(40):
              try:
                  urllib.request.urlopen('http://127.0.0.1:5173/api/v1/health',timeout=1).close()
                  break
              except Exception:time.sleep(1)
          else:raise SystemExit('Isolated preview not ready')
          PY
          node scripts/phase3_browser_qa.mjs
          node scripts/phase6_browser_qa.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-quality
          path: |
            Frontend/coverage/
            /tmp/release-browser/
          retention-days: 7
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Backend/requirements.lock
      - name: Isolated audit tools
        run: |
          python -m venv /tmp/release-audit
          /tmp/release-audit/bin/python -m pip install -r Backend/requirements-quality.txt
          /tmp/release-audit/bin/pip-audit --strict -r Backend/requirements.lock --format=json --output=pip-audit.json
          /tmp/release-audit/bin/bandit -q -lll -iii -f json -o bandit.json Backend/api.py Backend/security.py Backend/safe_http.py Backend/event_repository.py Backend/entity_resolution.py Backend/event_contract.py Backend/event_normalization.py Backend/catalog_query.py Backend/identity_backfill.py Backend/run_scan.py Backend/source_ingestion.py Backend/notifier/outbox.py Backend/notifier/telegram_bot.py Backend/db/mongo_client.py
      - name: Secrets and Docker-context regression
        run: |
          python scripts/scan_secrets.py --output secrets.json
          python scripts/check_build_context.py --output build-context.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-quality
          path: |
            pip-audit.json
            bandit.json
            secrets.json
            build-context.json
          retention-days: 7
